    value_template: '{{ value_json.value[0].power|float(0)|round(0) }}'
    unit_of_measurement: W
  - name: Inverter State
    unique_id: inverter_state
    state_topic: victron/N/b827ebea1ece/system/0/SystemState/State
    value_template: "{% if value_json.value == 0 %}\n  Off\n{% elif value_json.value == 2 %}\n  VE.Bus Fault condition\n\
      {% elif value_json.value == 3 %}\n  Bulk\n{% elif value_json.value == 4 %}\n  Absorption\n{% elif value_json.value\
      \ == 5 %}\n  Float\n{% elif value_json.value == 6 %}\n  Storage\n{% elif value_json.value == 7 %}\n  Equalize\n\
      {% elif value_json.value == 8 %}\n  Passthru\n{% elif value_json.value == 9 %}\n  Inverting\n{% elif value_json.value\
      \ == 10 %}\n  Assisting\n{% elif value_json.value == 252 %}\n  External control\n{% elif value_json.value\
      \ == 256 %}\n  Discharging\n{% elif value_json.value == 257 %}\n  Sustain\n{% else %}\n  Error - No Data\n\
      {% endif %}\n"
  - name: Solar Charger State
    unique_id: solar_charger_state
    state_topic: victron/N/b827ebea1ece/solarcharger/289/State
    value_template: "{% if value_json.value == 0 %}\n  Off\n{% elif value_json.value == 2 %}\n  Fault\n{% elif value_json.value\
      \ == 3 %}\n  Bulk\n{% elif value_json.value == 4 %}\n  Absorption\n{% elif value_json.value == 5 %}\n  Float\n\
      {% elif value_json.value == 6 %}\n  Storage\n{% elif value_json.value == 7 %}\n  Equalize\n{% else %}\n  Error\
      \ - No Data\n{% endif %}\n"
  - name: Battery Remaining
    unique_id: battery_remaining
    icon: mdi:timer-sand
    state_topic: victron/N/b827ebea1ece/system/0/Dc/Battery/TimeToGo
    value_template: "{% set battery_load = states('sensor.battery_load') | int(0) %}\n{% if value is not defined\
      \ %}\n  Error\n{% elif value == '{\"value\": null}' or battery_load > 0 %}\n  ∞\n{% else %}\n  {% set seconds\
      \ = value_json.value | round(0) | int %}\n  {% set days = (seconds / 86400) | round(0, 'floor') | int %}\n\
      \  {% set hours = ((seconds - days * 86400) / 3600) | round(0, 'floor') | int %}\n  {% set minutes = ((seconds\
      \ - hours * 3600) / 60) | round(0, 'floor') | int %}\n\n  {% if 2 > days >= 1 %}\n    {{days}} Day\n  {% elif\
      \ days >= 2 %}\n    {{days}} Days\n  {% elif hours > 0 %}\n    {{hours}} Hours\n  {% elif minutes > 0 %}\n\
      \    {{minutes}} Minutes\n  {% endif %}\n{% endif %}\n"
number:
  - unique_id: multiplus_grid_setpoint
    name: Grid Setpoint
    min: -4000
    max: 4000
    step: 10
    mode: box
    command_topic: victron/W/b827ebea1ece/settings/0/Settings/CGwacs/AcPowerSetPoint
    command_template: '{"value": {{ value }} }'
    state_topic: victron/N/b827ebea1ece/settings/0/Settings/CGwacs/AcPowerSetPoint
    value_template: '{{value_json.value | round(0) }}'
    device_class: power
    unit_of_measurement: W
    icon: mdi:meter-electric-outline
    device:
      identifiers:
        - Victron Cerbo GX
      manufacturer: Victron Energy
      model: Cerbo GX
      name: Cerbo GX
  - unique_id: multiplus_ac_current_limit
    name: AC Current limit
    min: 0
    max: 25
    step: 1
    mode: box
    command_topic: victron/W/b827ebea1ece/vebus/276/Ac/ActiveIn/CurrentLimit
    command_template: '{"value": {{ value }} }'
    state_topic: victron/N/b827ebea1ece/vebus/276/Ac/ActiveIn/CurrentLimit
    value_template: '{{ value_json.value }}'
    device_class: current
    unit_of_measurement: A
    icon: mdi:current-ac
    device:
      identifiers:
        - Victron Cerbo GX
      manufacturer: Victron Energy
      model: Cerbo GX
      name: Cerbo GX
  - unique_id: multiplus_min_soc
    name: Minimum SOC
    min: 15
    max: 100
    step: 5
    mode: box
    command_topic: victron/W/b827ebea1ece/settings/0/Settings/CGwacs/BatteryLife/MinimumSocLimit
    command_template: '{"value": {{ value }} }'
    state_topic: victron/N/b827ebea1ece/settings/0/Settings/CGwacs/BatteryLife/MinimumSocLimit
    value_template: '{{value_json.value | round(0) }}'
    device_class: battery
    icon: mdi:battery-20
    unit_of_measurement: '%'
    device:
      identifiers:
        - Victron Cerbo GX
      manufacturer: Victron Energy
      model: Cerbo GX
      name: Cerbo GX
  - unique_id: multiplus_max_soc
    name: Max SOC
    min: 50
    max: 100
    step: 5
    mode: box
