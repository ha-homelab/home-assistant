# Home Assistant configuration; retain stable entity identifiers.
switch:
  - name: Victron Quattro
    unique_id: victron_quattro
    state_topic: victron/N/b827ebea1ece/vebus/290/Mode
    command_topic: victron/W/b827ebea1ece/vebus/290/Mode
    payload_on: '{"value":3}'
    payload_off: '{"value":4}'
  - name: Inverter Only Charging
    unique_id: mqtt_switch_inverter_only_charging
    state_topic: inverter/state
    value_template: '{{ ''ON'' if value_json.booleans.only_charging else ''OFF'' }}'
    command_topic: inverter/cmd/toggle
    command_template: '{"entity": "only_charging", "state": {{ "\"" ~ ("on" if value == "ON" else "off") ~ "\""
      }} }'
  - name: Inverter No Feed
    unique_id: mqtt_switch_inverter_no_feed
    state_topic: inverter/state
    value_template: '{{ ''ON'' if value_json.booleans.no_feed else ''OFF'' }}'
    command_topic: inverter/cmd/toggle
    command_template: '{"entity": "no_feed", "state": {{ "\"" ~ ("on" if value == "ON" else "off") ~ "\"" }} }'
  - name: Inverter House Support
    unique_id: mqtt_switch_inverter_house_support
    state_topic: inverter/state
    value_template: '{{ ''ON'' if value_json.booleans.house_support else ''OFF'' }}'
    command_topic: inverter/cmd/toggle
    command_template: '{"entity": "house_support", "state": {{ "\"" ~ ("on" if value == "ON" else "off") ~ "\""
      }} }'
  - name: Inverter Charge Battery
    unique_id: mqtt_switch_inverter_charge_battery
    state_topic: inverter/state
    value_template: '{{ ''ON'' if value_json.booleans.charge_battery else ''OFF'' }}'
    command_topic: inverter/cmd/toggle
    command_template: '{"entity": "charge_battery", "state": {{ "\"" ~ ("on" if value == "ON" else "off") ~ "\""
      }} }'
  - name: Inverter Do Not Supply EV
    unique_id: mqtt_switch_inverter_do_not_supply_ev
    state_topic: inverter/state
    value_template: '{{ ''ON'' if value_json.booleans.do_not_supply_charger else ''OFF'' }}'
    command_topic: inverter/cmd/toggle
    command_template: '{"entity": "do_not_supply_charger", "state": {{ "\"" ~ ("on" if value == "ON" else "off")
      ~ "\"" }} }'
  - name: Inverter Limit To EV
    unique_id: mqtt_switch_inverter_limit_to_ev
    state_topic: inverter/state
    value_template: '{{ ''ON'' if value_json.booleans.set_limit_to_ev_charger else ''OFF'' }}'
    command_topic: inverter/cmd/toggle
    command_template: '{"entity": "set_limit_to_ev_charger", "state": {{ "\"" ~ ("on" if value == "ON" else "off")
      ~ "\"" }} }'
  - name: Inverter Minimize Charging
    unique_id: mqtt_switch_inverter_minimize_charging
    state_topic: inverter/state
    value_template: '{{ ''ON'' if value_json.booleans.minimize_charging else ''OFF'' }}'
    command_topic: inverter/cmd/toggle
    command_template: '{"entity": "minimize_charging", "state": {{ "\"" ~ ("on" if value == "ON" else "off") ~ "\""
      }} }'
binary_sensor:
  - name: Victron Grid Connected
    unique_id: victron_grid_connected
    device_class: connectivity
    state_topic: victron/N/b827ebea1ece/vebus/290/Ac/ActiveIn/Connected
    value_template: >-
      {% set sample = value_json | default({}) %}
      {% set v = sample.get('value') if sample is mapping else none %}
      {{ 'ON' if v is not boolean and is_number(v) and v | float == 1 else 'OFF' }}
    availability_topic: victron/N/b827ebea1ece/vebus/290/Ac/ActiveIn/Connected
    availability_template: >-
      {% set sample = value_json | default({}) %}
      {% set v = sample.get('value') if sample is mapping else none %}
      {{ 'online' if v is not boolean and is_number(v) and v | float in [0, 1] else 'offline' }}
    expire_after: 90
