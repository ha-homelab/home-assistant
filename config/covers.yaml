# Template covers use HA positions: 0 closed, 100 open.
- unique_id: living_light_curtains_r
  name: Living light curtains R
  device_class: curtain
  availability: >-
    {{ has_value('cover.living_light_curtains_l') and state_attr('cover.living_light_curtains_l', 'current_position') is number }}
  position: >-
    {{ [[(state_attr('cover.living_light_curtains_l', 'current_position') | float(0)), 0] | max, 100] | min }}
  open_cover:
    action: cover.open_cover
    target:
      entity_id: cover.living_light_curtains_l
  close_cover:
    action: cover.close_cover
    target:
      entity_id: cover.living_light_curtains_l
  stop_cover:
    action: cover.stop_cover
    target:
      entity_id: cover.living_light_curtains_l
  set_cover_position:
    action: cover.set_cover_position
    data:
      position: '{{ position }}'
    target:
      entity_id: cover.living_light_curtains_l
