- unique_id: office_curtains_r
  name: Office Curtains R
  device_class: curtain
  availability: >-
    {{ states('cover.office_curtains_office_curtains') != 'unavailable'
       and not state_attr('cover.office_curtains_office_curtains', 'restored')
       and state_attr('cover.office_curtains_office_curtains', 'raw_state') in ['open', 'close', 'stop', 'continue'] }}
  position: >-
    {% set actual = state_attr('cover.office_curtains_office_curtains', 'current_position') %}
    {{ [[100 - actual, 0] | max, 100] | min if actual is number else none }}
  open_cover:
    action: cover.close_cover
    target:
      entity_id: cover.office_curtains_office_curtains
  close_cover:
    action: cover.open_cover
    target:
      entity_id: cover.office_curtains_office_curtains
  stop_cover:
    action: cover.stop_cover
    target:
      entity_id: cover.office_curtains_office_curtains
  set_cover_position:
    action: cover.set_cover_position
    data:
      position: '{{ 100 - position }}'
    target:
      entity_id: cover.office_curtains_office_curtains
