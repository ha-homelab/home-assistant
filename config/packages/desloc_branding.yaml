# HACS 2.0.5 uses external branding for integration updates and does not
# provide update pictures for dashboard cards. Use the shared local icon.
homeassistant:
  customize:
    update.desloc_experimental_update:
      entity_picture: /local/desloc/icon.png
    update.desloc_lock_card_update:
      entity_picture: /local/desloc/icon.png
