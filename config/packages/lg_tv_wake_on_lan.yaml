# HA runs in OCI. Emit the broadcast on the home LAN through a restricted SSH key.
shell_command:
  living_room_tv_wake: >-
    /usr/bin/ssh -T -i /config/.ssh/living_room_tv_wol
    -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes
    -o UserKnownHostsFile=/config/.ssh/living_room_tv_wol_known_hosts
    -o HostKeyAlias=living-room-tv-wol
    -o ConnectTimeout=5 -o ConnectionAttempts=1
    -o ServerAliveInterval=5 -o ServerAliveCountMax=1
    alvit@syn wake-living-room-tv

automation:
  - id: living_room_tv_wake_on_lan
    alias: Living room TV - wake over Ethernet
    description: Wake the wired LG through the home LAN relay, falling back to
      Harmony PowerOn if the relay fails or the TV does not confirm waking.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: webostv.turn_on
        entity_id: media_player.living_room_tv_77
    actions:
      - condition: template
        value_template: >-
          {{ states('media_player.living_room_tv_77') not in
             ['on', 'playing', 'paused', 'idle', 'buffering'] }}
      - action: shell_command.living_room_tv_wake
        response_variable: wake_result
        continue_on_error: true
      - if: >-
          {{ wake_result is defined and wake_result is mapping
             and wake_result.get('returncode', -1) == 0 }}
        then:
          - wait_template: >-
              {{ states('media_player.living_room_tv_77') in
                 ['on', 'playing', 'paused', 'idle', 'buffering'] }}
            timeout: "00:00:45"
            continue_on_timeout: true
      # A discrete PowerOn is safe if the TV wakes just before this call.
      # Never use PowerToggle, remote.turn_on or an activity change here.
      - if: >-
          {{ states('media_player.living_room_tv_77') not in
             ['on', 'playing', 'paused', 'idle', 'buffering'] }}
        then:
          - action: remote.send_command
            target:
              entity_id: remote.harmonyhub
            data:
              device: LG TV
              command: PowerOn
          - wait_template: >-
              {{ states('media_player.living_room_tv_77') in
                 ['on', 'playing', 'paused', 'idle', 'buffering'] }}
            timeout: "00:00:45"
            continue_on_timeout: true
      - if: >-
          {{ states('media_player.living_room_tv_77') not in
             ['on', 'playing', 'paused', 'idle', 'buffering'] }}
        then:
          - stop: The LG TV did not confirm power-on after Wake-on-LAN and Harmony PowerOn.
            error: true
