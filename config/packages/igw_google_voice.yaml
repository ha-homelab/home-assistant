# Generated by igw-cast-ha. Replace the previous package; do not install both.
# HA only triggers playback. The local Cast service fetches and renders IGW data.
# Keep credentials in secrets.yaml and REST command logging at warning or above.
logger:
  logs:
    homeassistant.components.rest_command: warning

rest_command:
  igw_cast_report:
    url: "http://192.168.167.25:8091/v1/reports/{{ report_key if report_key is defined and report_key is string and report_key in ['battery', 'solar', 'solar_today', 'status', 'alarms', 'flow'] else 'invalid' }}"
    method: POST
    timeout: 10
    headers:
      Authorization: !secret igw_cast_authorization
      Accept: "application/json"
      Cache-Control: "no-store"

script:
  igw_google_energy_dispatch:
    alias: "IGW energy dispatcher (private)"
    mode: queued
    max: 10
    max_exceeded: warning
    trace:
      stored_traces: 0
    fields:
      report_key:
        name: Report
        required: true
        selector:
          select:
            options: ['battery', 'solar', 'solar_today', 'status', 'alarms', 'flow']
    sequence:
      - if:
          - condition: template
            value_template: >-
              {{ not (report_key is defined and report_key is string and report_key in ['battery', 'solar', 'solar_today', 'status', 'alarms', 'flow']) }}
        then:
          - stop: "Invalid energy report."
            error: true
      - variables:
          cast_response: {}
      - action: rest_command.igw_cast_report
        data:
          report_key: "{{ report_key }}"
        response_variable: cast_response
        continue_on_error: true
      - choose:
          - conditions: "{{ cast_response is mapping and cast_response.get('status') == 202 }}"
            sequence:
              - stop: "Energy report accepted by the display service."
          - conditions: "{{ cast_response is mapping and cast_response.get('status') == 409 }}"
            sequence:
              - stop: "An energy report is already being prepared or played."
        default:
          - stop: "The energy display service could not accept the report."
            error: true

  igw_google_battery:
    alias: "Battery report"
    icon: "mdi:account-voice"
    mode: queued
    max: 10
    trace:
      stored_traces: 0
    sequence:
      - action: script.igw_google_energy_dispatch
        data:
          report_key: battery

  igw_google_solar:
    alias: "Solar power report"
    icon: "mdi:account-voice"
    mode: queued
    max: 10
    trace:
      stored_traces: 0
    sequence:
      - action: script.igw_google_energy_dispatch
        data:
          report_key: solar

  igw_google_solar_today:
    alias: "Solar today report"
    icon: "mdi:account-voice"
    mode: queued
    max: 10
    trace:
      stored_traces: 0
    sequence:
      - action: script.igw_google_energy_dispatch
        data:
          report_key: solar_today

  igw_google_status:
    alias: "Energy status report"
    icon: "mdi:account-voice"
    mode: queued
    max: 10
    trace:
      stored_traces: 0
    sequence:
      - action: script.igw_google_energy_dispatch
        data:
          report_key: status

  igw_announce_alarms:
    alias: "Energy alarms report"
    icon: "mdi:account-voice"
    mode: queued
    max: 10
    trace:
      stored_traces: 0
    sequence:
      - action: script.igw_google_energy_dispatch
        data:
          report_key: alarms

  igw_google_flow:
    alias: "Energy flow report"
    icon: "mdi:account-voice"
    mode: queued
    max: 10
    trace:
      stored_traces: 0
    sequence:
      - action: script.igw_google_energy_dispatch
        data:
          report_key: flow
