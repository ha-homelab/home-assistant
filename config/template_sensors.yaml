# Home Assistant configuration; retain stable entity identifiers.
- name: Water Fill Speed
  availability: "{{ is_number(states('sensor.water_speed')) }}"
  unit_of_measurement: cm/h
  state_class: measurement
  state: >-
    {% set rate = states('sensor.water_speed') | float(0) %}
    {{ rate | round(2) if rate > 0 else 0 }}
- name: Dishwasher Duration
  unique_id: dishwasher_duration
  icon: mdi:timer-outline
  state: '{% set duration = states(''sensor.dishwasher_wash_time_today'') | float(0) %} {% set hours = duration
    | int %} {% set minutes = ((duration - hours) * 60) | int %} {% set seconds = ((duration * 3600) % 60) | int
    %} {{ "%02d:%02d:%02d" | format(hours, minutes, seconds) }}

    '
- name: Battery Minimum Cell Voltage
  unit_of_measurement: V
  state: "{% set voltages = [\n  states('sensor.battery_cell_1_voltage') | float(default=none),\n  states('sensor.battery_cell_2_voltage')\
    \ | float(default=none),\n  states('sensor.battery_cell_3_voltage') | float(default=none),\n  states('sensor.battery_cell_4_voltage')\
    \ | float(default=none),\n  states('sensor.battery_cell_5_voltage') | float(default=none),\n  states('sensor.battery_cell_6_voltage')\
    \ | float(default=none),\n  states('sensor.battery_cell_7_voltage') | float(default=none),\n  states('sensor.battery_cell_8_voltage')\
    \ | float(default=none),\n  states('sensor.battery_cell_9_voltage') | float(default=none),\n  states('sensor.battery_cell_10_voltage')\
    \ | float(default=none),\n  states('sensor.battery_cell_11_voltage') | float(default=none),\n  states('sensor.battery_cell_12_voltage')\
    \ | float(default=none),\n  states('sensor.battery_cell_13_voltage') | float(default=none),\n  states('sensor.battery_cell_14_voltage')\
    \ | float(default=none),\n  states('sensor.battery_cell_15_voltage') | float(default=none),\n  states('sensor.battery_cell_16_voltage')\
    \ | float(default=none)\n] | select('is_number') | list %} {% if voltages | count > 0 %}\n  {{ voltages | min\
    \ }}\n{% else %}\n  unavailable\n{% endif %}\n"
  device_class: voltage
  state_class: measurement
