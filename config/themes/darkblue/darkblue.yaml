# Home Assistant configuration; retain stable entity identifiers.
Dark - Blue:
  # Current HA form controls must inherit the dark semantic palette.
  modes:
    dark: {}
  # Dark inset fields keep the existing blue focus labels and placeholders legible.
  ha-color-form-background: '#080D18'
  ha-color-form-background-hover: '#0D1220'
  codemirror-comment: '#BAC0C6'
  app-header-background-color: var(--background-color)
  background-color-2: '#20293c'
  background-color: '#242e42'
  card-background-color: var(--paper-card-background-color)
  ch-background: var(--background-color)
  more-info-header-background: var(--secondary-background-color)
  paper-dialog-background-color: '#1F1F28'
  paper-item-background-color: '#23232E'
  paper-slider-container-color: var(--background-color-2)
  switch-checked-track-color: var(--background-color-2)
  switch-unchecked-track-color: var(--background-color-2)
  primary-color: '#2F7EFD'
  light-primary-color: '#6FA6FE'
  primary-background-color: '#1F1F28'
  secondary-background-color: var(--primary-background-color)
  divider-color: '#2F2F3D'
  primary-text-color: '#FFFFFF'
  secondary-text-color: '#6FA6FE'
  text-primary-color: '#FFFFFF'
  disabled-text-color: '#4E4E66'
  sidebar-icon-color: '#B6B6C1'
  sidebar-text-color: '#F1F1F1'
  sidebar-selected-background-color: var(--primary-background-color)
  sidebar-selected-icon-color: '#6FA6FE'
  sidebar-selected-text-color: var(--sidebar-selected-icon-color)
  state-icon-color: '#2F7EFD'
  state-icon-active-color: '#FBCD41'
  state-icon-unavailable-color: var(--disabled-text-color)
  paper-slider-knob-color: '#2F7EFD'
  paper-slider-knob-start-color: var(--paper-slider-knob-color)
  paper-slider-pin-color: var(--paper-slider-knob-color)
  paper-slider-active-color: var(--paper-slider-knob-color)
  paper-slider-secondary-color: var(--light-primary-color)
  label-badge-background-color: '#23232E'
  label-badge-text-color: '#F1F1F1'
  label-badge-red: '#6FA6FE'
  paper-card-background-color: '#23232E'
  paper-listbox-background-color: var(--primary-background-color)
  paper-toggle-button-checked-button-color: '#2F7EFD'
  paper-toggle-button-checked-bar-color: '#6FA6FE'
  paper-toggle-button-unchecked-button-color: var(--paper-toggle-button-checked-button-color)
  paper-toggle-button-unchecked-bar-color: '#3E4756'
  table-row-background-color: var(--primary-background-color)
  table-row-alternative-background-color: var(--secondary-background-color)
  paper-input-color: '#FFFFFF'
  input-text-color: '#FFFFFF'
  input-background-color: '#2F3A57'
  paper-input-container-color: '#B6B6C1'
  paper-input-container-input-color: '#FFFFFF'
  paper-input-container-background-color: '#2F3A57'
  paper-input-container-focus-color: '#6FA6FE'
  paper-input-container-input-background-color: '#2F3A57'
  input-ink-color: var(--primary-text-color)
  input-label-ink-color: var(--secondary-text-color)
  input-disabled-ink-color: var(--secondary-text-color)
  input-fill-color: '#2F3A57'
  input-dropdown-icon-color: var(--primary-text-color)
  input-idle-line-color: var(--secondary-text-color)
  input-hover-line-color: var(--primary-text-color)
  input-disabled-line-color: var(--disabled-text-color)
  input-outlined-idle-border-color: var(--disabled-text-color)
  input-outlined-hover-border-color: var(--disabled-text-color)
  input-outlined-disabled-border-color: var(--disabled-text-color)
  input-disabled-fill-color: rgba(0, 0, 0, 0)
