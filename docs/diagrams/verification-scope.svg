xt x="780" y="316" font-size="16" fill="#334155" font-weight="400">Installed revision confirmed</text><text x="780" y="347" font-size="16" fill="#334155" font-weight="400">Entity state and availability</text><text x="780" y="378" font-size="16" fill="#334155" font-weight="400">Device commands observed</text><text x="780" y="409" font-size="16" fill="#334155" font-weight="400">Recovery tested deliberately</text><text x="780" y="440" font-size="16" fill="#334155" font-weight="400">Requires separate live evidence</text><rect x="40" y="583" width="1040" height="82" rx="12" fill="#0f172a"/><text x="60" y="617" font-size="19" fill="#fff" font-weight="600">Keep the latest Studio curtain implementation from the reviewed public source.</text><text x="60" y="645" font-size="16" fill="#cbd5e1" font-weight="400">Do not restore an entire older private library to recover a few private identifiers.</text>
