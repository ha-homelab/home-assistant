<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="740" viewBox="0 0 1120 740" role="img" aria-labelledby="title desc">
<title id="title">Three different kinds of evidence</title><desc id="desc">SOURCE CHECKS: Valid source. YAML and include structure. Library identity contracts. Tracked build inputs. Privacy and secret review. No device communication ASSEMBLY CHECKS: Correct bundle. Exact source revision. Explicit private inputs. Full output file inventory. Approved bytes and IDs. No live rollout INSTALLATION CHECKS: Working home. Installed revision confirmed. Entity state and availability. Device commands observed. Recovery tested deliberately. Requires separate live evidenceKeep the latest Studio curtain implementation from the reviewed public source.. Do not restore an entire older private library to recover a few private identifiers.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker></defs>
<rect width="1120" height="740" rx="24" fill="#f1f5f9"/><path d="M24 0H1096Q1120 0 1120 24V128H0V24Q0 0 24 0" fill="#0f172a"/>
<g font-family="DejaVu Sans, Arial, sans-serif"><text x="40" y="48" font-size="29" fill="#ffffff" font-weight="700">Three different kinds of evidence</text><text x="40" y="84" font-size="17" fill="#cbd5e1" font-weight="400">A green check is meaningful only when its scope is stated.</text>
