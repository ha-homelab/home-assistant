name: Configuration CI
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: pip install -r requirements.txt
    - name: Check Python common errors without suppressing inline findings
      run: |
        python -m pip install -r requirements-lint.txt
        python -m ruff check --select F --ignore-noqa --exclude config/python_scripts .
        # Home Assistant injects these names only into python_script snippets.
        python -m ruff check --select F --ignore-noqa --config 'builtins=["hass","data","logger","output"]' config/python_scripts
    - run: python tools/validate.py
    - name: Validate bundled automation and script contracts
      run: 'python dependencies/automations/tools/validate.py

        python dependencies/scripts/tools/validate.py

        '
    - name: Test bundled component validators
      run: '(cd dependencies/automations && python -m unittest discover -s tests -v)

        (cd dependencies/scripts && python -m unittest discover -s tests -v)

        '
    - name: Build a complete release without private dependencies
      run: python tools/build.py "$RUNNER_TEMP/ha-release"
    - run: python -m compileall -q tools config/python_scripts config/custom_zha_quirks
    - name: Test Core update card confirmation and stale-candidate handling
      run: node tests/core_update_card.cjs config/www/core-update-card.js
    - name: Fetch pinned LocalTuya source for hotfix regression tests
      run: "curl --fail --location --retry 2 --max-time 30 \\\n  https://raw.githubusercontent.com/xZetsubou/hass-localtuya/3d0c0ec737b59ebfb1eea65df42f5d902eafaecc/custom_components/localtuya/cover.py\
        \ \\\n  --output \"$RUNNER_TEMP/localtuya-cover.py\"\necho \"e5a0f563de34a0252cd2f732f264deab9f6e9c9dc5d32fbf9ee4e34545424af9\
        \  $RUNNER_TEMP/localtuya-cover.py\" | sha256sum --check\n"
    - name: Fetch pinned Vehicle Info Card for JavaScript regression tests
      run: "cache_dir=\"$HOME/.cache/ha-ci-sources\"\ncached=\"$cache_dir/vehicle-info-card-1.12.3.js\"\nmkdir -p \"$cache_dir\"\
        \nif ! echo \"ea1a5f23dfd4f28a2b2eb48d99adc2f40b65d3d2e36a8364442d6ddfdca9dcfe  $cached\" | sha256sum --check --status\
        \ 2>/dev/null; then\n  curl --fail --location --retry 2 --retry-max-time 900 --connect-timeout 30 --max-time 600 \\\
        \n    https://github.com/ngocjohn/vehicle-info-card/releases/download/v1.12.3/vehicle-info-card.js \\\n    --output\
        \ \"$RUNNER_TEMP/vehicle-info-card.js\"\n  echo \"ea1a5f23dfd4f28a2b2eb48d99adc2f40b65d3d2e36a8364442d6ddfdca9dcfe\
        \  $RUNNER_TEMP/vehicle-info-card.js\" | sha256sum --check\n  cp \"$RUNNER_TEMP/vehicle-info-card.js\" \"$cached\"\
        \nfi\ncp \"$cached\" \"$RUNNER_TEMP/vehicle-info-card.js\"\necho \"ea1a5f23dfd4f28a2b2eb48d99adc2f40b65d3d2e36a8364442d6ddfdca9dcfe\
        \  $RUNNER_TEMP/vehicle-info-card.js\" | sha256sum --check\n"
    - run: python -m unittest discover -s tests -v
      env:
        LOCAL_TUYA_COVER_SOURCE: ${{ runner.temp }}/localtuya-cover.py
        VEHICLE_INFO_CARD_SOURCE: ${{ runner.temp }}/vehicle-info-card.js
    - name: Scan source and comments with the pinned secret scanner
      run: "case \"$RUNNER_ARCH\" in\n  X64)\n    asset_arch=x64\n    checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb\n\
        \    ;;\n  ARM64)\n    asset_arch=arm64\n    checksum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080\n\
        \    ;;\n  *)\n    echo \"Unsupported runner architecture: $RUNNER_ARCH\" >&2\n    exit 1\n    ;;\nesac\ncache_dir=\"\
        $HOME/.cache/gitleaks/8.30.1\"\narchive=\"$cache_dir/gitleaks_8.30.1_linux_${asset_arch}.tar.gz\"\nmkdir -p \"$cache_dir\"\
        \nif ! echo \"$checksum  $archive\" | sha256sum --check --status 2>/dev/null; then\n  download=\"$RUNNER_TEMP/gitleaks-8.30.1-${asset_arch}.tar.gz\"\
        \n  curl --fail --location --silent --show-error --retry 2 --retry-max-time 900 --connect-timeout 30 --max-time 600\
        \ \\\n    \"https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${asset_arch}.tar.gz\"\
        \ \\\n    --output \"$download\"\n  echo \"$checksum  $download\" | sha256sum --check\n  mv \"$download\" \"$archive\"\
        \nfi\necho \"$checksum  $archive\" | sha256sum --check\ntar -xzf \"$archive\" -C \"$RUNNER_TEMP\" gitleaks\n\"$RUNNER_TEMP/gitleaks\"\
        \ dir . --redact --no-banner\n"
  maintenance-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
      with:
        egress-policy: audit
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Verify RF matching and guarded transmission without hardware I/O
      run: docker run --rm --network none --read-only --tmpfs /tmp:rw --env REQUIRE_HA_RUNTIME=1 --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
        --workdir /workspace --entrypoint python ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
        -m unittest discover -s tests -p test_rf_airbridge.py -v
    - name: Verify RM433 player navigation and bounded delivery without hardware I/O
