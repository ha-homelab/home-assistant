name: Approve opted-in checked PR
on:
  workflow_run:
    workflows: [Quality gate]
    types: [completed]
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  approve:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    # This reviewed metadata-only workflow_run path uses the isolated automation pool.
    # The general reserve generator intentionally refuses local automation steps.
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (github.event_name == 'workflow_run' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.workflow_run.name == 'Quality gate' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.status == 'completed' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) && (vars.CI_RUNNER_AUTOMATION_LABELS || '[]') || '["ubuntu-24.04"]') }}
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25
        with:
          egress-policy: audit
      # Metadata only: no checkout, downloaded artifact or PR code is executed.
      - name: Approve the currently opted-in checked commit
        shell: python3 -I {0}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          import json
          import os
          import urllib.request

          repository = os.environ['GITHUB_REPOSITORY']
          prefix = f'repos/{repository}'

          def api(path, payload=None):
              request = urllib.request.Request(
                  f'https://api.github.com/{path}',
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={
                      'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          run = api(f"{prefix}/actions/runs/{int(os.environ['RUN_ID'])}")
          workflow = api(f'{prefix}/actions/workflows/quality-gate.yml')
          if not (
              run['workflow_id'] == workflow['id']
              and run['event'] == 'pull_request'
              and run['status'] == 'completed'
              and run['conclusion'] == 'success'
              and (run.get('head_repository') or {}).get('full_name') == repository
          ):
              raise SystemExit('The current run is not an eligible successful Quality gate')
          head = run['head_sha']
          for candidate in api(f'{prefix}/commits/{head}/pulls?per_page=100'):
              pr = api(f"{prefix}/pulls/{int(candidate['number'])}")
              if not (
                  pr['state'] == 'open' and not pr['draft']
                  and pr['user']['login'] == '4alvit'
                  and (pr['head']['repo'] or {}).get('full_name') == repository
                  and pr['base']['repo']['full_name'] == repository
                  and pr['base']['ref'] == 'main'
                  and pr['head']['sha'] == head
                  and any(label['name'] == 'auto-approve' for label in pr['labels'])
              ):
                  continue
              api(f"{prefix}/pulls/{int(pr['number'])}/reviews", {
                  'event': 'APPROVE',
                  'commit_id': head,
                  'body': 'Maintainer opt-in via auto-approve: the complete Quality gate passed for this exact commit. This records CI status, not an independent human code review.',
              })
              print(f"Approved PR #{pr['number']} at {head}")
