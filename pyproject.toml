[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-notification-frame-cache"
version = "0.1.3"
description = "Bounded private JPEG notification cache extracted from Home Assistant tooling"
readme = "docs/notification-frame-cache.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Operating System :: POSIX", "Programming Language :: Python :: 3"]

[tool.setuptools]
py-modules = ["notification_frame_cache"]
package-dir = {"" = "config/housekeeping"}
