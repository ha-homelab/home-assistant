# Decorative lights: Turn off the laser at night.
# Stable entity: automation.laser_off_at_night.
- id: ha_homelab_decorative_lights_turn_off_the_laser_at_night
  alias: 'Decorative lights: Turn off the laser at night'
  description: Turn off the laser at night. Responds to sun.sun below -3. Runs only when all configured
    guards pass.
  triggers:
  - platform: numeric_state
    entity_id: sun.sun
    value_template: '{{ state_attr(''sun.sun'', ''elevation'') }}'
    below: -3
  conditions:
  - condition: state
    entity_id: input_boolean.curtains_sticky
    state: 'off'
  actions:
  - service: switch.turn_off
    entity_id: switch.mishka_guard
  mode: single
  trace:
    stored_traces: 5
