# Hallway: Turn off lights after motion clears.
# Stable entity: automation.hallway_motion_off.
- id: ha_homelab_hallway_turn_off_lights_after_motion_clears
  alias: 'Hallway: Turn off lights after motion clears'
  description: Turn off after a new motion cycle or genuine unknown/unavailable recovery. Preserve later manual
    ON states; recheck all original timeout, presence and override guards for each device and retry.
  mode: parallel
  trace:
    stored_traces: 5
  use_blueprint:
    path: ha_homelab/motion_light_off.yaml
    input:
      motion_triggers:
      - entity_id: binary_sensor.rf_hallway_motion
        platform: state
        to: 'off'
        for:
          minutes: 5
      - entity_id: binary_sensor.rf_hallway_two_motion
        platform: state
        to: 'off'
        for:
          minutes: 5
      target_entities:
      - light.hall_1_m
      - light.hall_2_m
      guards:
      - condition: template
        value_template: '{{ state_attr("sun.sun", "elevation") < 1.95 }}'
      - condition: state
        entity_id: input_boolean.hallway_sticky
        state: 'off'
