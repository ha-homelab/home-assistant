# Hallway: Turn off lights in the morning.
# Stable entity: automation.hallway_off_in_the_morning.
- id: ha_homelab_hallway_turn_off_lights_in_the_morning
  alias: 'Hallway: Turn off lights in the morning'
  description: Turn off lights in the morning. Responds to the daily schedule at 07:00:00. Only command
    a light while every owning room Sticky helper is explicitly off; check each target independently.
  triggers:
    platform: time
    at: 07:00:00
  actions:
  - if:
    - condition: state
      entity_id: input_boolean.hallway_sticky
      state: 'off'
    then:
    - service: light.turn_off
      entity_id: light.hall_1_m
  - if:
    - condition: state
      entity_id: input_boolean.hallway_sticky
      state: 'off'
    - condition: state
      entity_id: input_boolean.mishka_room_sticky
      state: 'off'
    then:
    - service: light.turn_off
      entity_id: light.hall_2_m
  mode: single
  trace:
    stored_traces: 5
