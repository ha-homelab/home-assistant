# Solar: Disable auxiliary devices after sustained low production.
# Stable entity: automation.solar_3_or_4_producing_below_150w_for_five_minutes.
- id: ha_homelab_solar_disable_auxiliary_devices_after_sustained_low_production
  alias: 'Solar: Disable auxiliary devices after sustained low production'
  description: Disable auxiliary devices after sustained low production. Responds to sensor.heater_one_energy_power
    below 150 for 5 minutes; or sensor.heater_two_energy_power below 150 for 5 minutes; or sensor.ppv1_w below 300
    for 5 minutes; or sensor.ppv2_w below 300 for 5 minutes; or sensor.ppv3_w below 300 for 5 minutes. Runs only
    when all configured guards pass.
  triggers:
  - platform: numeric_state
    entity_id: sensor.heater_one_energy_power
    below: 150
    for:
      minutes: 5
  - platform: numeric_state
    entity_id: sensor.heater_two_energy_power
    below: 150
    for:
      minutes: 5
  - platform: numeric_state
    entity_id: sensor.ppv1_w
    below: 300
    for:
      minutes: 5
  - platform: numeric_state
    entity_id: sensor.ppv2_w
    below: 300
    for:
      minutes: 5
  - platform: numeric_state
    entity_id: sensor.ppv3_w
    below: 300
    for:
      minutes: 5
  conditions:
  - condition: state
    entity_id: switch.mppt_fan
    state: 'on'
  actions:
  - service: switch.turn_off
    entity_id: switch.mppt_fan
  - service: switch.turn_off
    entity_id: switch.heater_three
  - service: script.notify
    data:
      message: Solar 3 or 4 producing below 150W for five minutes
    continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
