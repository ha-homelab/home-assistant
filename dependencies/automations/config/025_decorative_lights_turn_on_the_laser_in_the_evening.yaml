# Decorative lights: Turn on the laser in the evening.
# Stable entity: automation.laser_on_in_the_evening.
- id: ha_homelab_decorative_lights_turn_on_the_laser_in_the_evening
  alias: 'Decorative lights: Turn on the laser in the evening'
  description: Turn on the laser in the evening. Responds to sun.sun below 0.4. Runs only when all configured
    guards pass.
  triggers:
  - platform: numeric_state
    entity_id: sun.sun
    value_template: '{{ state_attr(''sun.sun'', ''elevation'') }}'
    below: 0.4
  conditions:
  - condition: state
    entity_id: input_boolean.curtains_sticky
    state: 'off'
  actions:
  - service: switch.turn_on
    entity_id: switch.mishka_guard
  mode: single
  trace:
    stored_traces: 5
