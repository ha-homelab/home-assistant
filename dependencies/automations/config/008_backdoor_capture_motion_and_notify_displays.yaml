# Backdoor: Capture motion and notify displays.
# Stable entity: automation.backdoor_motion.
- id: ha_homelab_backdoor_capture_motion_and_notify_displays
  alias: 'Backdoor: Capture motion and notify displays'
  description: Capture motion and notify displays. Responds to MQTT messages on kios/backdoor. Runs only when all
    configured guards pass.
  triggers:
  - platform: mqtt
    topic: kios/backdoor
  conditions:
  - condition: state
    entity_id: input_boolean.notifications_off
    state: 'off'
  actions:
  - action: script.capture_camera_alert
    data:
      camera_key: backdoor
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      also_chrome: true
      chrome_image: /local/backdoor_camera_alert.jpg?{{ as_timestamp(now()) }}
      notify_data:
        title: Backdoor Camera
        message: Motion detected
        data:
          displaytime: 20000
          icon: warning
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: Backdoor Camera
        message: Motion detected
        data:
          displaytime: 20000
          icon: warning
  mode: single
  trace:
    stored_traces: 5
