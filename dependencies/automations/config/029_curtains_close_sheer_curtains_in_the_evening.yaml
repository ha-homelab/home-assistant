# Curtains: Close sheer curtains in the evening.
# Stable entity: automation.close_light_curtains_in_the_evening.
- id: ha_homelab_curtains_close_sheer_curtains_in_the_evening
  alias: 'Curtains: Close sheer curtains in the evening'
  description: Close sheer curtains while the evening sun descends through 0 to 0.6 degrees. Power the
    living-room socket, start RF after three seconds, and retain a bounded Wi-Fi fallback. Respect the
    manual override.
  triggers:
  - platform: numeric_state
    entity_id: sun.sun
    value_template: '{{ state_attr(''sun.sun'', ''elevation'') }}'
    below: 0.6
    above: 0
  conditions:
  - condition: state
    entity_id: sun.sun
    attribute: rising
    state: false
  - condition: state
    entity_id: input_boolean.curtains_sticky
    state: 'off'
  actions:
  - action: script.living_curtains_move
    data:
      curtain: sheer
      command: close
  mode: single
  trace:
    stored_traces: 5
