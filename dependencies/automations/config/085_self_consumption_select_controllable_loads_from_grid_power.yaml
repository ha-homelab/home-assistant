# Energy-selected lights obey the same room overrides as motion and time schedules.
- id: '1234567890123'
  alias: 'Self-consumption: Select controllable loads from grid power'
  description: Select controllable loads from grid power. Responds to the repeating schedule (seconds=/2).
    Runs only when all configured guards pass. Exclude lighting protected by room Sticky helpers from
    selection and recheck immediately before each command.
  triggers:
  - platform: time_pattern
    seconds: /2
  conditions:
  - condition: state
    entity_id: input_boolean.modern_self_consuming
    state: 'on'
  actions:
  - variables:
      sensor_val: '{{ (states(''sensor.home_123_1s'') | float(0)) - (states(''sensor.battery_w'') | float(0))
        + 200 | float }}'
      watt_map: |
        {
          "switch.switch06": 750,
          "switch.air_purifier_living": 235,
          "switch.bath_fan_1st_floor": 60,
          "light.dining_lights_dimmer_l": 90,
          "switch.living_room_light_l": 90,
          "switch.dining_wall_light_2": 20,
          "light.garage": 55,
          "switch.garage_floodlight": 108,
          "switch.tea_table": 35
        }
      md: '{{ ''turn_off'' if sensor_val >= 0 else ''turn_on'' }}'
      target_sticky_helpers:
        switch.tea_table:
        - input_boolean.kitchen_sticky
        switch.living_room_light_l:
        - input_boolean.living_room_sticky
        light.dining_lights_dimmer_l:
        - input_boolean.dining_room_sticky
        switch.dining_wall_light_2:
        - input_boolean.dining_room_sticky
        - input_boolean.lobby_sticky
  - variables:
      eligible_watt_map: |-
        {% set ns = namespace(pairs=[]) %}
        {% for entity, watts in (watt_map | from_json).items() %}
          {% if target_sticky_helpers.get(entity, []) | reject('is_state', 'off') | list | count == 0 %}
            {% set ns.pairs = ns.pairs + [(entity, watts)] %}
          {% endif %}
        {% endfor %}
        {{ dict(ns.pairs) }}
  - service: python_script.select_devices
    data:
      sensor_value: '{{ states(''sensor.home_123_1s'') | float -  states(''sensor.battery_w'') | float
        }}'
      devices: '{{ eligible_watt_map }}'
      action: '{{ md }}'
      tolerance: 30
    response_variable: select_result
  - variables:
      selected_entities: '{{ select_result.entities if ''entities'' in select_result else [] }}'
  - service: script.notify_mqtt
    data:
      message: 'Self-consuming:  {{ states(''sensor.home_123_1s'') }};  {{ md }}: {{ selected_entities
        | join('', '') }}'
    continue_on_error: true
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ selected_entities | length > 0 }}'
      sequence:
      - repeat:
          for_each: '{{ selected_entities }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ target_sticky_helpers.get(repeat.item[0], []) | reject(''is_state'',
                ''off'') | list | count == 0 }}'
            then:
            - choose:
              - conditions:
                - condition: template
                  value_template: '{{ repeat.item[0].startswith(''switch.'') }}'
                sequence:
                - service: switch.{{ md }}
                  data:
                    entity_id: '{{ repeat.item[0] }}'
                  continue_on_error: true
              - conditions:
                - condition: template
                  value_template: '{{ repeat.item[0].startswith(''light.'') }}'
                sequence:
                - service: light.{{ md }}
                  data: |-
                    {{ dict(entity_id=repeat.item[0], brightness=100)
                       if md == 'turn_on' else dict(entity_id=repeat.item[0]) }}
                  continue_on_error: true
            - service: script.notify_mqtt
              data:
                message: "{{ md }}: {{ repeat.item[0] }} ({{ repeat.item[1] }} \u0412\u0442)"
              continue_on_error: true
  - delay: 00:00:05
  mode: single
  trace:
    stored_traces: 5
