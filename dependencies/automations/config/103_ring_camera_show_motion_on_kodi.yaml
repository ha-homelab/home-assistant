# Ring camera: Show motion on Kodi.
# Stable entity: automation.ring_motion_display_on_kodi.
- id: ha_homelab_ring_camera_show_motion_on_kodi
  alias: 'Ring camera: Show motion on Kodi'
  description: Show motion on Kodi. Responds to MQTT messages on kios/ring. Runs only when all configured guards
    pass.
  triggers:
  - platform: mqtt
    topic: kios/ring
  conditions:
  - condition: template
    value_template: '{{ trigger.payload_json[''name''] == ''Ring'' }}'
  actions:
  - service: script.notify_mqtt
    data:
      message: Ring camera motion {{ as_timestamp(now()) | timestamp_custom('%H:%M', true) }}
    continue_on_error: true
  - action: script.capture_camera_alert
    data:
      camera_key: ring
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      notify_data:
        title: Ring Camera
        message: Motion detected {{ as_timestamp(now()) | timestamp_custom('%H:%M', true) }}
        data:
          displaytime: 20000
          icon: warning
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: Ring Camera
        message: Motion detected {{ as_timestamp(now()) | timestamp_custom('%H:%M', true) }}
        data:
          displaytime: 20000
          icon: warning
  - service: persistent_notification.create
    data_template:
      title: Ding-dong. Ring camera motion!
      message: Ding-dong. Ring camera motion! {{ as_timestamp(now()) | timestamp_custom('%H:%M', true) }}
  mode: single
  trace:
    stored_traces: 5
