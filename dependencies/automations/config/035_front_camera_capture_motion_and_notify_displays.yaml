# Front camera: Capture motion and notify displays.
# Stable entity: automation.front_motion.
- id: ha_homelab_front_camera_capture_motion_and_notify_displays
  alias: 'Front camera: Capture motion and notify displays'
  description: Capture motion and notify displays. Responds to MQTT messages on kios/front.
  triggers:
  - platform: mqtt
    topic: kios/front
  actions:
  - action: script.capture_camera_alert
    data:
      camera_key: front
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      also_chrome: true
      chrome_image: /local/front_camera_alert.jpg?{{ as_timestamp(now()) }}
      notify_data:
        title: Front Camera
        message: Motion detected
        data:
          displaytime: 20000
          icon: warning
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: Front Camera
        message: Motion detected
        data:
          displaytime: 20000
          icon: warning
  mode: single
  trace:
    stored_traces: 5
