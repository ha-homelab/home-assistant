# Curtains: Close in the evening.
# Stable entity: automation.close_curtains_in_the_evening.
- id: ha_homelab_curtains_close_in_the_evening
  alias: 'Curtains: Close in the evening'
  description: Close curtains below 0.2 degrees sun elevation. Each room independently requires its room
    Sticky and Curtains Sticky to be off before power, movement and delayed power-off. Preserve the 90-second
    warm-up and one-hour power-off delay; living-room RF starts after three seconds.
  triggers:
  - platform: numeric_state
    entity_id: sun.sun
    value_template: '{{ state_attr(''sun.sun'', ''elevation'') }}'
    below: 0.2
  conditions:
  - condition: state
    entity_id: input_boolean.curtains_sticky
    state: 'off'
  actions:
  - parallel:
    - sequence:
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.kitchen_sticky
        state: 'off'
      - service: switch.turn_on
        entity_id: switch.kitchen_guard
        continue_on_error: true
      - delay: 00:01:30
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.kitchen_sticky
        state: 'off'
      - service: cover.close_cover
        entity_id: cover.kitchen_curtains_l
        continue_on_error: true
      - delay: 01:00:00
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.kitchen_sticky
        state: 'off'
      - service: switch.turn_off
        entity_id: switch.kitchen_guard
        continue_on_error: true
    - sequence:
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.studio_sticky
        state: 'off'
      - service: switch.turn_on
        entity_id: switch.studio_guard
        continue_on_error: true
      - delay: 00:01:30
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.studio_sticky
        state: 'off'
      - service: cover.close_cover
        entity_id: cover.studio_curtains
        continue_on_error: true
      - delay: 01:00:00
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.studio_sticky
        state: 'off'
      - service: switch.turn_off
        entity_id: switch.studio_guard
        continue_on_error: true
    - sequence:
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.dining_room_sticky
        state: 'off'
      - service: switch.turn_on
        entity_id: switch.dining_guard
        continue_on_error: true
      - delay: 00:01:30
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.dining_room_sticky
        state: 'off'
      - service: cover.close_cover
        entity_id: cover.dining_curtains_l
        continue_on_error: true
      - delay: 01:00:00
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.dining_room_sticky
        state: 'off'
      - service: switch.turn_off
        entity_id: switch.dining_guard
        continue_on_error: true
    - sequence:
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.living_room_sticky
        state: 'off'
      - action: script.living_curtains_move
        data:
          curtain: main
          command: close
  mode: single
  trace:
    stored_traces: 5
