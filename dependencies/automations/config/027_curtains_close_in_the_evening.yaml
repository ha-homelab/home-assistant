# Curtains: Close in the evening.
# Stable entity: automation.close_curtains_in_the_evening.
- id: ha_homelab_curtains_close_in_the_evening
  alias: 'Curtains: Close in the evening'
  description: Below 0.2 degrees sun elevation, start living-room main RF closing after three seconds
    with a bounded Wi-Fi fallback. Preserve other rooms, their 90-second warm-up, one-hour power-off delay,
    and the manual override. Studio closes through its calibrated ZHA cover.
  triggers:
  - platform: numeric_state
    entity_id: sun.sun
    value_template: '{{ state_attr(''sun.sun'', ''elevation'') }}'
    below: 0.2
  conditions:
  - condition: state
    entity_id: input_boolean.curtains_sticky
    state: 'off'
  actions:
  - parallel:
    - sequence:
      - service: switch.turn_on
        entity_id: switch.kitchen_guard
      - service: switch.turn_on
        entity_id: switch.studio_guard
      - service: switch.turn_on
        entity_id: switch.dining_guard
      - delay: 00:01:30
      - service: cover.close_cover
        entity_id: cover.kitchen_curtains_l
      # Legacy Wi-Fi motor; retained for a manual rollback only.
      # - service: cover.close_cover
      #   entity_id: cover.office_curtains_r
      - service: cover.close_cover
        entity_id: cover.studio_curtains
        continue_on_error: true
      - service: cover.close_cover
        entity_id: cover.dining_curtains_l
      - delay: 01:00:00
      - service: switch.turn_off
        entity_id: switch.dining_guard
      - service: switch.turn_off
        entity_id: switch.kitchen_guard
      - service: switch.turn_off
        entity_id: switch.studio_guard
    - sequence:
      - action: script.living_curtains_move
        data:
          curtain: main
          command: close
  mode: single
  trace:
    stored_traces: 5
