# Notifications: Report switch state changes.
# Stable entity: automation.switch_trigger_notifications.
- id: ha_homelab_notifications_report_switch_state_changes
  alias: 'Notifications: Report switch state changes'
  description: Report switch state changes. Responds to switch.tea_table, switch.led_under_cabinet,
    switch.bath2, light.fireplace_led_ll, switch.tv_backlight_l,
    switch.audio_system_hall, sensor.switch06_signal, switch.mishka_guard, switch.range_hood_l, switch.audiosystem_l,
    switch.moen_flo_water_monitor_power, switch.pump_power_enable, switch.laundry, switch.fireplace_led_ll, switch.tv_backlight_l, switch.recliner, switch.hall_sockets_behind_tv_2_l,
    switch.heater_l, switch.clock_l, switch.garage_door_power, switch.mishka_bedroom_desk_lamp_l, switch.bathroom_warmer,
    switch.attic_dehumidifier_l, switch.ice_maker_l, switch.living_lamp changing to on.
  triggers:
    platform: state
    from: 'off'
    to: 'on'
    entity_id:
    - switch.tea_table
    - switch.led_under_cabinet
    - switch.bath2
    - light.fireplace_led_ll
    - switch.tv_backlight_l
    - switch.audio_system_hall
    - sensor.switch06_signal
    - switch.mishka_guard
    - switch.range_hood_l
    - switch.audiosystem_l
    - switch.moen_flo_water_monitor_power
    - switch.pump_power_enable
    - switch.laundry
    - switch.fireplace_led_ll
    - switch.tv_backlight_l
    - switch.recliner
    - switch.hall_sockets_behind_tv_2_l
    - switch.heater_l
    - switch.clock_l
    - switch.garage_door_power
    - switch.mishka_bedroom_desk_lamp_l
    - switch.bathroom_warmer
    - switch.attic_dehumidifier_l
    - switch.ice_maker_l
    - switch.living_lamp
  actions:
  - action: script.notify_optional
    data:
      notify_service: notify.lg_webos_tv_oled77c5pua_dusqljr
      notify_data:
        message: '{{ trigger.to_state.attributes.friendly_name }} turned {{ trigger.to_state.state }}'
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      also_chrome: true
      notification_category: light_switch_state
      notify_data:
        title: Switch {{ trigger.to_state.attributes.friendly_name }} triggered:{{ trigger.to_state.state }}
        message: '{{ trigger.to_state.attributes.friendly_name }} turned {{ trigger.to_state.state }}'
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: Switch {{ trigger.to_state.attributes.friendly_name }} triggered:{{ trigger.to_state.state }}
        message: '{{ trigger.to_state.attributes.friendly_name }} turned {{ trigger.to_state.state }}'
  - action: script.notify_optional
    data:
      notify_service: notify.almbpo
      notify_data:
        message: '{{ trigger.to_state.attributes.friendly_name }} turned {{ trigger.to_state.state }}'
  mode: single
  trace:
    stored_traces: 5
