# Bedroom: Turn off lights after motion clears.
# Stable entity: automation.bedroom_motion_off.
- id: ha_homelab_bedroom_turn_off_lights_after_motion_clears
  alias: 'Bedroom: Turn off lights after motion clears'
  description: Turn off after a new motion cycle or genuine unknown/unavailable recovery. Preserve later manual
    ON states; recheck all original timeout, presence and override guards for each device and retry.
  mode: parallel
  trace:
    stored_traces: 5
  use_blueprint:
    path: ha_homelab/motion_light_off.yaml
    input:
      motion_triggers:
      - entity_id: binary_sensor.rf_bedroom_motion
        platform: state
        to: 'off'
        for:
          minutes: 3
      target_entities:
      - light.bedroom_lamp
      guards:
      - condition: template
        value_template: '{{ state_attr("sun.sun", "elevation") < 0.60 }}'
      - condition: time
        after: '18:00:00'
        before: '23:10:00'
      - condition: state
        entity_id: input_boolean.bedroom_sticky
        state: 'off'
