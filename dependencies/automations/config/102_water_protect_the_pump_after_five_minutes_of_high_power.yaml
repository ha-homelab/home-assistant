# Stable identity retained for existing dashboards and history.
- id: ha_homelab_water_protect_the_pump_after_five_minutes_of_high_power
  alias: 'Water: Protect the pump after two minutes of high power'
  description: Stop pump power and request Flo after the ESPHome triple outlet exceeds 700 W continuously for two
    minutes while pump power is enabled. Tank-level availability does not block protection. Power is the shared
    outlet total.
  triggers:
  - trigger: template
    value_template: '{{ is_state(''switch.pump_power_enable'', ''on'') and is_number(states(''sensor.kmc_water_and_laundry_power''))
      and states(''sensor.kmc_water_and_laundry_power'') | float(0) > 700 }}'
    for:
      minutes: 2
  conditions:
  - condition: state
    entity_id: switch.pump_power_enable
    state: 'on'
  actions:
  - action: script.turn_on
    target:
      entity_id: script.water_flo_failover
    data:
      variables:
        reason: ESPHome outlet above 700 W for 2 minutes
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      also_chrome: true
      notify_data:
        title: 'Pump high-power protection: 2 minutes'
        message: ESPHome water outlet power stayed above 700 W for 2 minutes. Pump stop and Flo fallback requested.
        data:
          displaytime: 20000
          icon: warning
    continue_on_error: true
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: 'Pump high-power protection: 2 minutes'
        message: ESPHome water outlet power stayed above 700 W for 2 minutes. Pump stop and Flo fallback requested.
        data:
          displaytime: 20000
          icon: warning
    continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
