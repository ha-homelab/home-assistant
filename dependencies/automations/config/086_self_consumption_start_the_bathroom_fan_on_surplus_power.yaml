# Self-consumption: Start the bathroom fan on surplus power.
# Stable entity: automation.power_below_80_bath_1st_floor.
- id: ha_homelab_self_consumption_start_the_bathroom_fan_on_surplus_power
  alias: 'Self-consumption: Start the bathroom fan on surplus power'
  description: Start the bathroom fan on surplus power. Responds to sensor.home_123_1s below -80; or sensor.home_123_1s
    below -150; or sensor.home_123_1s below -200; or sensor.home_123_1s below -350. Runs only when all configured
    guards pass.
  triggers:
  - platform: numeric_state
    entity_id: sensor.home_123_1s
    below: -80
  - platform: numeric_state
    entity_id: sensor.home_123_1s
    below: -150
  - platform: numeric_state
    entity_id: sensor.home_123_1s
    below: -200
  - platform: numeric_state
    entity_id: sensor.home_123_1s
    below: -350
  conditions:
  - condition: state
    entity_id: input_boolean.self_consuming
    state: 'on'
  - condition: not
    conditions:
    - condition: state
      entity_id: switch.bath_fan_1st_floor
      state: 'on'
  actions:
  - service: switch.turn_on
    entity_id: switch.bath_fan_1st_floor
  - service: script.notify
    data:
      message: Power below 80 Bath 1st floor
    continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
