# Hallway: Turn on lights after motion.
# Stable entity: automation.hallway_motion_triggered.
- id: ha_homelab_hallway_turn_on_lights_after_motion
  alias: 'Hallway: Turn on lights after motion'
  description: Turn on lights after motion. Responds to binary_sensor.rf_hallway_motion changing to on; or binary_sensor.rf_hallway_two_motion
    changing to on. Runs only when all configured guards pass. Independent lighting
    commands continue if another device fails.
  triggers:
  - entity_id: binary_sensor.rf_hallway_motion
    platform: state
    to: 'on'
  - entity_id: binary_sensor.rf_hallway_two_motion
    platform: state
    to: 'on'
  conditions:
  - condition: template
    value_template: '{{ state_attr("sun.sun", "elevation") < 1.75 }}'
  - condition: state
    entity_id: input_boolean.hallway_sticky
    state: 'off'
  actions:
  - service: script.notify_mqtt_log
    data:
      message: Hallway automation triggered {{ as_timestamp(now()) | timestamp_custom('%H:%M', true) }}
    continue_on_error: true
  - if:
    - condition: state
      entity_id: input_boolean.hallway_sticky
      state: 'off'
    then:
    - service: light.turn_on
      entity_id: light.hall_1_m
      continue_on_error: true
      data_template:
        brightness: '{{ 185 if now().strftime("%H")|int < 16 or now().strftime("%H")|int > 22 else 255 }}'
        transition: '{{ 100 if trigger.to_state.state == "on" else 20 }}'
  - if:
    - condition: state
      entity_id: input_boolean.hallway_sticky
      state: 'off'
    - condition: state
      entity_id: input_boolean.mishka_room_sticky
      state: 'off'
    then:
    - service: light.turn_on
      entity_id: light.hall_2_m
      continue_on_error: true
      data_template:
        brightness: '{{ 185 if now().strftime("%H")|int < 16 or now().strftime("%H")|int > 22 else 255 }}'
        transition: '{{ 100 if trigger.to_state.state == "on" else 20 }}'
  mode: single
  trace:
    stored_traces: 5
