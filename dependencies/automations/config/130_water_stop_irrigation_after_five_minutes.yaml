# Water: Stop irrigation after five minutes.
# Stable entity: automation.water_timer_running_for_more_than_five_minutes.
- id: ha_homelab_water_stop_irrigation_after_five_minutes
  alias: 'Water: Stop irrigation after five minutes'
  description: Stop irrigation after five minutes. Responds to switch.smart_water_timer_smart_water_timer changing
    to on for 5 minutes.
  triggers:
  - platform: state
    to: 'on'
    entity_id: switch.smart_water_timer_smart_water_timer
    for:
      minutes: 5
  actions:
  - service: switch.turn_off
    entity_id: switch.smart_water_timer_smart_water_timer
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      also_chrome: true
      notify_data:
        title: Water timer running for more than five minutes
        message: Water timer running for more than five minutes {{ as_timestamp(now()) | timestamp_custom('%H:%M',
          true) }}
        data:
          displaytime: 20000
          icon: warning
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: Water timer running for more than five minutes
        message: Water timer running for more than five minutes {{ as_timestamp(now()) | timestamp_custom('%H:%M',
          true) }}
        data:
          displaytime: 20000
          icon: warning
  - service: persistent_notification.create
    data_template:
      title: Water timer running for more than five minutes
      message: Water timer running for more than five minutes {{ as_timestamp(now()) | timestamp_custom('%H:%M',
        true) }}
  mode: single
  trace:
    stored_traces: 5
