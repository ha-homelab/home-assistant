# Stable identity retained for existing dashboards and history.
- id: ha_homelab_water_protect_the_pump_after_one_minute_of_high_power
  alias: 'Water: Protect the pump after one minute of high power'
  description: Retained three-minute low-level backup. It acts only while pump power remains on; the independent
    two-minute protection normally acts first. Requests the shared guarded Flo fallback.
  triggers:
  - platform: numeric_state
    entity_id: sensor.kmc_water_and_laundry_power
    above: 700
    for:
      minutes: 3
  conditions:
  - condition: state
    entity_id: switch.pump_power_enable
    state: 'on'
  - condition: numeric_state
    entity_id: sensor.water_cm
    below: 19
  - condition: numeric_state
    entity_id: sensor.water_cm
    above: 5
  actions:
  - action: script.turn_on
    target:
      entity_id: script.water_flo_failover
    data:
      variables:
        reason: ESPHome outlet above 700 W for 3 minutes
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      also_chrome: true
      notify_data:
        title: 'Pump high-power protection: 3 minutes'
        message: ESPHome water outlet power stayed above 700 W for 3 minutes. Pump stop and Flo fallback requested.
        data:
          displaytime: 20000
          icon: warning
    continue_on_error: true
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: 'Pump high-power protection: 3 minutes'
        message: ESPHome water outlet power stayed above 700 W for 3 minutes. Pump stop and Flo fallback requested.
        data:
          displaytime: 20000
          icon: warning
    continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
