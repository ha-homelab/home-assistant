# Porch: Turn on the light from a notification.
# Stable entity: automation.notify_html5notificationclicked.
- id: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  alias: 'Porch: Turn on the light from a notification'
  description: Turn on the light from a notification button. Uses HTML5 browser event entities.
  triggers:
  - trigger: event.received
    target:
      entity_id:
      - event.chrome
    options:
      event_type:
      - clicked
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state.attributes.get(''action'') == ''porch_light_on'' }}'
  actions:
  - entity_id: light.porch_one
    service: light.turn_on
  mode: single
  trace:
    stored_traces: 5
