# Water: Start the pump above the upper level threshold.
# Stable entity: automation.water_level_more_than_19_centimeters.
- id: ha_homelab_water_start_the_pump_above_the_upper_level_threshold
  alias: 'Water: Start the pump above the upper level threshold'
  description: Start the pump above the upper level threshold. Responds to sensor.water_cm above 27. Runs only when
    all configured guards pass.
  triggers:
  - platform: numeric_state
    entity_id: sensor.water_cm
    above: &water_129_minimum 27
  conditions:
  - condition: state
    entity_id: switch.pump_power_enable
    state: 'off'
  actions:
  - service: switch.turn_on
    entity_id: switch.pump_power_enable
  # Dispatch asynchronously: an offline valve must not block the next pump event.
  - action: script.turn_on
    target:
      entity_id: script.water_valve_after_pump
    data:
      variables:
        pump_state: 'on'
        valve_state: 'off'
        min_cm: *water_129_minimum
  - service: script.notifymax
    data:
      message: Water level more than 27 centimeters
    continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
