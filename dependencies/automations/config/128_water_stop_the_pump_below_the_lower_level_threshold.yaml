# Water: Stop the pump below the lower level threshold.
# Stable entity: automation.water_level_less_than_18_centimeters.
- id: ha_homelab_water_stop_the_pump_below_the_lower_level_threshold
  alias: 'Water: Stop the pump below the lower level threshold'
  description: Stop the pump below the lower level threshold. Responds to sensor.water_cm above 1 below 26. Runs
    only when all configured guards pass.
  triggers:
  - platform: numeric_state
    entity_id: sensor.water_cm
    above: &water_128_minimum 1
    below: &water_128_maximum 26
  conditions:
  - condition: state
    entity_id: switch.pump_power_enable
    state: 'on'
  actions:
  - service: switch.turn_off
    entity_id: switch.pump_power_enable
  # Dispatch asynchronously: an offline valve must not block the next pump event.
  - action: script.turn_on
    target:
      entity_id: script.water_valve_after_pump
    data:
      variables:
        pump_state: 'off'
        valve_state: 'on'
        min_cm: *water_128_minimum
        max_cm: *water_128_maximum
  - service: script.notifymax
    data:
      message: Water level less than 26 centimeters
    continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
