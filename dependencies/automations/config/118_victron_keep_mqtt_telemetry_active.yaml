# Example device binding: the all-zero identifier is synthetic, not functional.
# Preserve and supply this installation-specific file outside Git before deployment.
# Victron: Keep MQTT telemetry active.
# Stable entity: automation.victron_mqtt_keep_alive.
- id: '1608310266736'
  alias: 'Victron: Keep MQTT telemetry active'
  description: >-
    Keep Venus telemetry active every five seconds without repeated full-tree
    publications. Refresh the expiring battery input with an exact read and
    request the complete tree once when Home Assistant connects to MQTT. The
    grid input is refreshed by the root package that follows the announced
    VE.Bus instance.
  triggers:
  - platform: time_pattern
    seconds: /5
    id: heartbeat
  - platform: mqtt
    topic: homeassistant/status
    payload: online
    id: mqtt_connected
  conditions:
  - condition: or
    conditions:
    - condition: trigger
      id: mqtt_connected
    - condition: template
      value_template: "{{ (state_attr(this.entity_id, 'current') | int(0)) == 0 }}"
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: mqtt_connected
      sequence:
      # Only connection bootstrap requests the full tree. The legacy Serial
      # request also renews the streaming lease and returns the exact value.
      - service: mqtt.publish
        data:
          topic: victron/R/000000000000/system/0/Serial
          payload: '{}'
    default:
    - service: mqtt.publish
      data:
        topic: victron/R/000000000000/system/0/Serial
        payload: '{"keepalive-options":["suppress-republish"]}'
  # This HA sensor expires after 90 seconds, even when its value does not
  # change. An exact read refreshes the real observation without replaying
  # every item. It carries no device instance: the grid input is read by the
  # root package that binds itself to the announced VE.Bus instance.
  - service: mqtt.publish
    data:
      topic: victron/R/000000000000/system/0/Dc/Battery/Voltage
      payload: '{}'
  # Skip overlapping periodic ticks, reserving the second slot for MQTT birth.
  mode: queued
  max: 2
  trace:
    stored_traces: 5
