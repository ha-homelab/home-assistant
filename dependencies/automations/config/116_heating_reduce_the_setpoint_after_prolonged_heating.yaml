# Heating: Reduce the setpoint after prolonged heating.
# Stable entity: automation.decrease_thermostat_temperature_gradually.
- id: ha_homelab_heating_reduce_the_setpoint_after_prolonged_heating
  alias: 'Heating: Reduce the setpoint after prolonged heating'
  description: Reduce the setpoint after prolonged heating. Responds to climate.thermostat_2 (hvac_action) changing
    to heating for 00:05:00. Runs only when all configured guards pass.
  triggers:
  - platform: state
    entity_id: climate.thermostat_2
    attribute: hvac_action
    to: heating
    for: 00:05:00
  conditions:
  - condition: template
    value_template: '{{ as_timestamp(now()) - as_timestamp(this.attributes.last_triggered, 0) > 300 }}'
  actions:
  - service: climate.set_temperature
    target:
      entity_id: climate.thermostat_2
    data:
      temperature: '{{ state_attr(''climate.thermostat_2'', ''temperature'') | float - 1 }}'
  - service: script.notify
    data:
      message: Furnace is heating for more than 5 minutes, reducing temperature by 1°C with a cooldown period
    continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
