# Self-consumption: Stop the large heater at the upper threshold.
# Stable entity: automation.power_above_735_heater_hard_stop.
- id: ha_homelab_self_consumption_stop_the_large_heater_at_the_upper_threshold
  alias: 'Self-consumption: Stop the large heater at the upper threshold'
  description: Stop the large heater at the upper threshold. Responds to sensor.home_123_1s above 735; or sensor.home_123_1s
    above 835; or sensor.home_123_1s above 935; or sensor.home_123_1s above 1035. Runs only when all configured
    guards pass.
  triggers:
  - platform: numeric_state
    entity_id: sensor.home_123_1s
    above: 735
  - platform: numeric_state
    entity_id: sensor.home_123_1s
    above: 835
  - platform: numeric_state
    entity_id: sensor.home_123_1s
    above: 935
  - platform: numeric_state
    entity_id: sensor.home_123_1s
    above: 1035
  conditions:
  - condition: state
    entity_id: input_boolean.self_consuming
    state: 'on'
  - condition: state
    entity_id: switch.switch06
    state: 'on'
  actions:
  - service: switch.turn_off
    entity_id: switch.switch06
  - service: script.notify
    data:
      message: Power above 735 heater hard stop
    continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
