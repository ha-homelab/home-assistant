# Decorative lights: Turn on the laser in the morning.
# Stable entity: automation.laser_on_in_the_morning.
- id: ha_homelab_decorative_lights_turn_on_the_laser_in_the_morning
  alias: 'Decorative lights: Turn on the laser in the morning'
  description: Turn on the laser in the morning. Responds to the daily schedule at 07:08:00. Runs only
    when all configured guards pass. Check each room override independently immediately before changing
    power.
  triggers:
    platform: time
    at: 07:08:00
  conditions:
  - condition: state
    entity_id: input_boolean.curtains_sticky
    state: 'off'
  actions:
  - parallel:
    - sequence:
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.mishka_room_sticky
        state: 'off'
      - service: switch.turn_on
        entity_id: switch.mishka_guard
        continue_on_error: true
    - sequence:
      - condition: state
        entity_id:
        - input_boolean.curtains_sticky
        - input_boolean.bedroom_sticky
        state: 'off'
      - service: switch.turn_on
        entity_id: switch.bedroom_guard
        continue_on_error: true
  mode: single
  trace:
    stored_traces: 5
