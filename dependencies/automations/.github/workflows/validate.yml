name: Validate automations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: automations-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate automation contracts
    if: >-
      github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, k3s, ha-homelab, private-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate identities and behavior preservation
        run: python tools/validate.py
      - name: Test inventory and retirement guardrails
        run: python -m unittest discover -s tests -v
      - name: Render the identity seed
        run: python tools/render_seed.py "$RUNNER_TEMP/automation-seed"
      - name: Scan source and comments with the pinned secret scanner
        run: |
          case "$RUNNER_ARCH" in
            X64)
              asset_arch=x64
              checksum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
              ;;
            ARM64)
              asset_arch=arm64
              checksum=e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
              ;;
            *)
              echo "Unsupported runner architecture: $RUNNER_ARCH" >&2
              exit 1
              ;;
          esac
          cache_dir="$HOME/.cache/gitleaks/8.30.1"
          archive="$cache_dir/gitleaks_8.30.1_linux_${asset_arch}.tar.gz"
          mkdir -p "$cache_dir"
          if ! echo "$checksum  $archive" | sha256sum --check --status 2>/dev/null; then
            download="$RUNNER_TEMP/gitleaks-8.30.1-${asset_arch}.tar.gz"
            curl --fail --location --silent --show-error --retry 2 --retry-max-time 900 --connect-timeout 30 --max-time 600 \
              "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_${asset_arch}.tar.gz" \
              --output "$download"
            echo "$checksum  $download" | sha256sum --check
            mv "$download" "$archive"
          fi
          echo "$checksum  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner

  device-recovery-runtime:
    name: Test device recovery in Home Assistant
    if: >-
      github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, k3s, ha-homelab, private-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Victron blackout and startup guards
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw
          --env REQUIRE_HA_RUNTIME=1
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
          --workdir /workspace --entrypoint python
          ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
          -m unittest discover -s tests -p test_victron_black_start.py -v
      - name: Verify Victron low-battery trigger recovery
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw
          --env REQUIRE_HA_RUNTIME=1
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
          --workdir /workspace --entrypoint python
          ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
          -m unittest discover -s tests -p test_victron_low_battery_triggers.py -v
      - name: Execute isolated device recovery scenarios
        # Home Assistant 2026.9.1, matching the deployed image and root CI.
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw
          --env REQUIRE_HA_RUNTIME=1
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
          --workdir /workspace --entrypoint python
          ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
          -m unittest discover -s tests -p test_device_recovery.py -v
      - name: Verify bounded Victron MQTT refresh and reconnect bootstrap
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw
          --env REQUIRE_HA_RUNTIME=1
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
          --workdir /workspace --entrypoint python
          ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
          -m unittest discover -s tests -p test_victron_keepalive.py -v
      - name: Verify curtain daylight and morning guards
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw
          --env REQUIRE_HA_RUNTIME=1
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
          --workdir /workspace --entrypoint python
          ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
          -m unittest discover -s tests -p test_living_curtain_daylight.py -v
      - name: Verify bedroom schedule and manual override without hardware I/O
        run: >-
          docker run --rm --network none --read-only --tmpfs /tmp:rw
          --env REQUIRE_HA_RUNTIME=1
          --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly"
          --workdir /workspace --entrypoint python
          ghcr.io/home-assistant/home-assistant@sha256:612d76760b544cb40b7ba01387fdac964c59a6a550a50a4d30b4773c822d2918
          -m unittest discover -s tests -p test_bedroom_lamp.py -v
