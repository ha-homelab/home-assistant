# Stable entity: script.frontmotion
# Take a front-camera snapshot and notify desktops; send browser notifications between 09:05 and 23:00.
# Keep the time condition after the snapshot and desktop notifications so those actions remain unconditional.
frontmotion:
  alias: 'Front camera: send motion notifications'
  description: Take a front-camera snapshot and notify desktops; send browser notifications between 09:05 and
    23:00.
  icon: mdi:cctv
  mode: single
  sequence:
  - action: script.capture_camera_alert
    data:
      camera_key: front
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      notify_data:
        title: Front Camera
        message: Motion detected
        data:
          displaytime: 20000
          icon: warning
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: Front Camera
        message: Motion detected
        data:
          displaytime: 20000
          icon: warning
  - condition: time
    after: '9:05:00'
    before: '23:00:00'
  - action: script.notify_optional
    data:
      notify_service: html5.send_message
      notify_data:
        message: Front Motion {{ as_timestamp(now()) | timestamp_custom('%H:%M', true) }}
        entity_id: notify.chrome
        icon: /local/front_camera_alert.jpg?{{ as_timestamp(now()) }}
        image: /local/front_camera_alert.jpg?{{ as_timestamp(now()) }}
        data:
          url: /local/front_camera_alert.jpg?{{ as_timestamp(now()) }}
