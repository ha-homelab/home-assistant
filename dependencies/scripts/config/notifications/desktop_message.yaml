# Stable entity: script.notify
# Send a timestamped message to the Roomba, iMac and Chrome notification targets.
notify:
  alias: 'Notifications: send desktop message'
  description: Send a timestamped message to the Roomba, iMac and Chrome notification targets.
  icon: mdi:message-text
  fields:
    message:
      name: Message
      description: Message text forwarded using the existing notification template.
      required: true
      selector:
        text:
          multiline: true
  mode: single
  sequence:
  - action: script.notify_optional
    data:
      notify_service: notify.roomba
      also_chrome: true
      notify_data:
        title: '{{ message }}'
        message: '{{ message }} {{ as_timestamp(now()) | timestamp_custom(''%H:%M'', true) }}'
        data:
          displaytime: 20000
          icon: warning
  - action: script.notify_optional
    data:
      notify_service: notify.imac21
      notify_data:
        title: '{{ message }}'
        message: '{{ message }} {{ as_timestamp(now()) | timestamp_custom(''%H:%M'', true) }}'
        data:
          displaytime: 20000
          icon: warning
