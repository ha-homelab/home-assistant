# Stable entity: script.tv_pic4
# Play channel identifier 1 on the living room TV.
tv_pic4:
  alias: 'Living room TV: play channel 1'
  description: Play channel identifier 1 on the living room TV.
  icon: mdi:television-play
  mode: single
  sequence:
    - service: media_player.play_media
      target:
        entity_id: media_player.living_room_tv_77
      data:
        media_content_id: '1'
        media_content_type: channel
