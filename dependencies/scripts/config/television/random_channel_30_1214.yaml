# Stable entity: script.tv_random_channel
# Send digits for a random channel from 30 through 1214 to the LG TV through Harmony with a 0.4-second delay.
tv_random_channel:
  alias: 'Living room TV: choose channel 30-1214'
  description: Send digits for a random channel from 30 through 1214 to the LG TV through Harmony with a 0.4-second
    delay.
  icon: mdi:shuffle-variant
  mode: single
  sequence:
    - service: remote.send_command
      data:
        entity_id: remote.harmonyhub
        device: LG TV
        delay_secs: 0.4
        command: |
          {% set p = range(30, 1215) | random | string %} {{ p | list }}
