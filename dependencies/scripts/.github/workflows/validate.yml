name: Validate scripts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scripts-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate YAML and behavior contracts
    if: >-
      github.event.repository.private && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, Linux, k3s, ha-homelab, private-ci]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Check scripts, identifiers, executable behavior, and credential patterns
        run: python tools/validate.py
      - name: Verify migration guardrails
        run: python -m unittest discover -s tests -v
